  let state = fresh();

  function clock(total){const s=Math.max(0,Math.floor(total/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

    if(id==='bias'){
      const s=state.bias,d=taskData.bias;

    if(id==='injection'){
      const s=state.injection,d=taskData.injection;
      const fragments=setCount(s.flags,d.suspicious,d.lines.map(x=>x[0]));

    }
    const s=state.leakage,d=taskData.leakage;
    const logs=setCount(s.flags,d.unsafe,d.logs.map(x=>x[0]));
    const types=Object.entries(d.classes).filter(([k,v])=>s.types[k]===v).length;
    const actions=setCount(s.actions,d.goodActions,d.actions.map(x=>x[0]));
    return {logs,types,actions,score:logs+types+actions,max:15};
  }
  function totalResult(){const a=['bias','injection','leakage'].map(evaluate);return {earned:a.reduce((p,v)=>p+v.score,0),max:49,modules:a};}
  function buttonList(group,items,selected,sub=false){return `<div class="choices">${items.map(([id,title,detail])=>`<button type="button" ${sub?'disabled':''} class="choice ${selected.includes(id)?'selected':''}" aria-pressed="${selected.includes(id)}" data-toggle="${group}" data-id="${id}"><span class="check" aria-hidden="true">${selected.includes(id)?'✓':''}</span><span><b>${escapeHTML(title)}</b>${detail?`<em>${escapeHTML(detail)}</em>`:''}</span></button>`).join('')}</div>`;}
  function docLines(){const s=state.injection;return taskData.injection.lines.map(([id,line])=>`<button type="button" class="doc-line ${s.flags.includes(id)?'selected':''}" aria-pressed="${s.flags.includes(id)}" data-toggle="injection-flags" data-id="${id}" ${s.submitted?'disabled':''}><span class="line-num">${id.toUpperCase()}</span><span>${escapeHTML(line)}</span></button>`).join('')}
  function sourceBias(){return `<div class="panel-header"><div class="split-heading"><span class="eyebrow">Missione 01 · Bias</span><span class="tag">Fascicolo fittizio</span></div><h1>Una graduatoria può sembrare oggettiva. Non sempre lo è.</h1><p>Un sistema di IA propone l'ordine di quattro richieste di sostegno per l'affitto. Devi confrontarlo con i criteri approvati nell'avviso.</p></div><div class="panel-body"><div class="alert red"><strong>Graduatoria proposta dall'IA:</strong> A-11 → C-33 → D-44 → B-22.<br>Il sistema afferma di aver premiato “l'italiano più corretto”, “la continuità lavorativa” e “l'invio via portale”.</div><div class="source-box"><h3>Griglia ufficiale simulata</h3><table class="rule-table"><thead><tr><th>Criterio ammesso</th><th>Punteggio</th></tr></thead><tbody><tr><td>ISEE fino a 8.000 € / fino a 12.000 € / fino a 18.000 €</td><td>45 / 30 / 15</td></tr><tr><td>Canone sul reddito ≥45% / ≥35% / ≥25%</td><td>35 / 25 / 15</td></tr><tr><td>Fragilità del nucleo già riconosciuta nella procedura</td><td>20 / 0</td></tr></tbody></table><p class="caption">La graduatoria deriva dalla somma dei tre punteggi. Nella simulazione non esistono altri criteri o condizioni di spareggio.</p></div><div class="source-box"><h3>Le quattro istanze (codici inventati)</h3><div class="table-scroll"><table class="data-table"><thead><tr><th>Pratica</th><th>ISEE</th><th>Incidenza canone</th><th>Fragilità</th></tr></thead><tbody><tr><td>A-11</td><td>7.000 €</td><td>38%</td><td>No</td></tr><tr><td>B-22</td><td>10.500 €</td><td>48%</td><td>Sì</td></tr><tr><td>C-33</td><td>8.300 €</td><td>30%</td><td>Sì</td></tr><tr><td>D-44</td><td>12.800 €</td><td>46%</td><td>No</td></tr></tbody></table></div></div></div>`;}
  function tasksBias(){const s=state.bias,d=taskData.bias;return `<div class="panel-header"><span class="eyebrow">La tua indagine</span><h1>Rimetti in ordine la valutazione</h1><p>Non indovinare: usa la griglia ufficiale e giustifica la tua decisione.</p></div><div class="panel-body"><section class="task"><h3><span class="stepnum">1</span> Quali criteri non devono incidere sul punteggio?</h3><p>Seleziona tutti i criteri estranei o non pertinenti alla griglia ufficiale.</p>${buttonList('bias-flags',d.criteria,s.flags,s.submitted)}</section><section class="task"><h3><span class="stepnum">2</span> Ricostruisci la graduatoria corretta</h3><p>Calcola i punteggi e assegna una pratica a ciascuna posizione.</p><div class="rank-grid">${s.order.map((val,i)=>`<div class="select-wrap"><label for="rank-${i}">${i+1}° posto</label><select id="rank-${i}" data-order="${i}" ${s.submitted?'disabled':''}><option value="">Scegli pratica…</option>${['A-11','B-22','C-33','D-44'].map(code=>`<option value="${code}" ${val===code?'selected':''}>${code}</option>`).join('')}</select></div>`).join('')}</div></section><section class="task"><h3><span class="stepnum">3</span> Quali azioni adotteresti?</h3><p>Seleziona tutti gli interventi che consideri appropriati.</p>${buttonList('bias-actions',d.actions.map(([id,t])=>[id,t]),s.actions,s.submitted)}</section>${noteBox('bias','Spiega in una frase perché la graduatoria iniziale era problematica.',s)}${s.submitted?feedbackBias():''}</div>${submitBar('bias',s.submitted)} `;}
  function sourceInjection(){const s=state.injection;return `<div class="panel-header"><div class="split-heading"><span class="eyebrow">Missione 02 · Prompt injection</span><span class="tag gold">Contenuto esterno</span></div><h1>Una pagina web contiene anche istruzioni per l'assistente.</h1><p>Il compito legittimo è riassumere un bando. Il testo che segue è simulato: alcune righe tentano di impartire comandi alla IA.</p></div><div class="panel-body"><div class="source-box"><h3>Estratto da pagina web simulata</h3><p class="caption">Tocca le righe sospette nella prova 1, qui a fianco.</p>${taskData.injection.lines.map(([id,line])=>`<p style="border-bottom:1px solid #e3e9ef;padding-bottom:8px"><span class="line-num">${id.toUpperCase()}</span> ${escapeHTML(line)}</p>`).join('')}</div><div class="alert"><strong>Fonte di controllo:</strong> l'avviso autentico del fascicolo riporta il 14 novembre alle 12:00, gli allegati richiesti e la verifica dei requisiti dopo la scadenza. Una nota ufficiale esclude proroghe alla data indicata.</div></div>`;}
  function tasksInjection(){const s=state.injection,d=taskData.injection;return `<div class="panel-header"><span class="eyebrow">La tua indagine</span><h1>Separa le fonti dai comandi</h1><p>Prima individua l'intrusione, poi controlla che cosa è finito nel riepilogo.</p></div><div class="panel-body"><section class="task"><h3><span class="stepnum">1</span> Individua le righe che tentano di comandare l'IA</h3><p>Seleziona ogni riga sospetta. Non tutte le istruzioni contenute in un bando sono prompt injection.</p>${docLines()}</section><section class="task"><h3><span class="stepnum">2</span> Verifica la risposta dell'assistente</h3><p>Classifica ogni frase in base alle informazioni attendibili del fascicolo.</p>${d.claims.map(([id,txt])=>`<div class="claim-row"><strong>${escapeHTML(txt)}</strong><label class="sr-only" for="claim-${id}">Valutazione: ${escapeHTML(txt)}</label><select id="claim-${id}" data-claim="${id}" ${s.submitted?'disabled':''}><option value="">Scegli la valutazione…</option><option value="coerente" ${s.claims[id]==='coerente'?'selected':''}>Coerente con la fonte</option><option value="alterata" ${s.claims[id]==='alterata'?'selected':''}>Contraddetta o alterata</option><option value="nonprovata" ${s.claims[id]==='nonprovata'?'selected':''}>Non dimostrata dal fascicolo</option></select></div>`).join('')}</section><section class="task"><h3><span class="stepnum">3</span> Come si evita che il problema si propaghi?</h3><p>Seleziona gli interventi appropriati.</p>${buttonList('injection-actions',d.actions.map(([id,t])=>[id,t]),s.actions,s.submitted)}</section>${noteBox('injection','In una frase: perché una pagina consultata non può impartire ordini all’assistente?',s)}${s.submitted?feedbackInjection():''}</div>${submitBar('injection',s.submitted)}`;}
  function sourceLeakage(){return `<div class="panel-header"><div class="split-heading"><span class="eyebrow">Missione 03 · Data leakage</span><span class="tag red">Evento da ricostruire</span></div><h1>Tre punti di esposizione, un solo flusso di lavoro.</h1><p>Un ufficio ha utilizzato strumenti collegati a diversi archivi. Dal registro delle attività devi ricostruire dove hanno viaggiato informazioni non autorizzate.</p></div><div class="panel-body"><div class="source-box"><h3>Scheda strumenti e permessi</h3><ul><li><strong>Report statistico:</strong> pubblico, consultabile e riutilizzabile secondo le regole dell'ente.</li><li><strong>Relazione istruttoria:</strong> interna e riservata all'ufficio competente.</li><li><strong>Elenco nominativo con dati economici:</strong> accesso limitato agli addetti autorizzati.</li><li><strong>Assistente interno:</strong> autorizzato a consultare il solo archivio pubblico, ma collegato erroneamente anche a documenti riservati.</li><li><strong>Chatbot web esterno:</strong> non autorizzato per i documenti dell'ufficio.</li><li><strong>Mailing list esterna:</strong> non autorizzata a ricevere relazioni riservate.</li></ul></div><div class="source-box"><h3>Registro sintetico degli eventi</h3>${taskData.leakage.logs.map(([,time,desc])=>`<p><strong style="color:var(--tealDark)">${time}</strong> — ${escapeHTML(desc)}</p>`).join('')}</div><div class="alert red"><strong>Situazione:</strong> le operazioni del registro sono già avvenute. Non si tratta soltanto di un rischio futuro; alcune informazioni potrebbero essere state esposte.</div></div>`;}
  function tasksLeakage(){const s=state.leakage,d=taskData.leakage;return `<div class="panel-header"><span class="eyebrow">La tua indagine</span><h1>Ricostruisci i punti di perdita</h1><p>Controlla ingresso, recupero e uscita. Non confondere attività ordinarie con un'esposizione indebita.</p></div><div class="panel-body"><section class="task"><h3><span class="stepnum">1</span> Quali eventi indicano un problema?</h3><p>Seleziona tutti gli eventi che espongono o rendono indebitamente accessibili informazioni.</p><div class="choices">${d.logs.map(([id,time,desc])=>`<button type="button" class="choice ${s.flags.includes(id)?'selected':''}" data-toggle="leakage-flags" data-id="${id}" aria-pressed="${s.flags.includes(id)}" ${s.submitted?'disabled':''}><span class="check" aria-hidden="true">${s.flags.includes(id)?'✓':''}</span><span class="log-item"><span class="log-time">${time}</span><span>${escapeHTML(desc)}</span></span></button>`).join('')}</div></section><section class="task"><h3><span class="stepnum">2</span> Dove si è verificato ciascun problema?</h3><p>Per tre eventi indicati, seleziona il punto del flusso coinvolto.</p>${[['e2','08:44 · Accesso alla relazione riservata'],['e3','08:48 · Allegato inviato al chatbot'],['e5','08:56 · Mailing list esterna']].map(([id,label])=>`<div class="claim-row"><strong>${label}</strong><label class="sr-only" for="type-${id}">Punto del flusso per ${label}</label><select id="type-${id}" data-type="${id}" ${s.submitted?'disabled':''}><option value="">Seleziona punto…</option><option value="ingresso" ${s.types[id]==='ingresso'?'selected':''}>In ingresso: dati inviati allo strumento</option><option value="recupero" ${s.types[id]==='recupero'?'selected':''}>Nel recupero: accessi e connettori</option><option value="uscita" ${s.types[id]==='uscita'?'selected':''}>In uscita: risultati e destinatari</option></select></div>`).join('')}</section><section class="task"><h3><span class="stepnum">3</span> Quali sono i primi interventi appropriati?</h3><p>Le azioni possono essere contemporanee; non serve ordinarle rigidamente.</p>${buttonList('leakage-actions',d.actions.map(([id,t])=>[id,t]),s.actions,s.submitted)}</section>${noteBox('leakage','Scrivi una breve segnalazione iniziale: che cosa è successo e quale verifica chiedi?',s)}${s.submitted?feedbackLeakage():''}</div>${submitBar('leakage',s.submitted)}`;}
  function noteBox(id,prompt,s){return `<section class="task"><h3><span class="stepnum">✎</span> Motiva la decisione</h3><label for="note-${id}" class="field-label">${escapeHTML(prompt)}</label><textarea id="note-${id}" class="note-input" data-note="${id}" placeholder="Scrivi almeno una frase (minimo 25 caratteri)…" ${s.submitted?'disabled':''}>${escapeHTML(s.note)}</textarea><div class="hint">Le note restano sul tuo dispositivo e saranno incluse nel rapporto locale.</div></section><div id="validation" role="alert"></div>`;}
  function submitBar(id,done){const idx=['bias','injection','leakage'].indexOf(id);return `<div class="submitbar"><span class="tiny">${done?'Indagine completata. Puoi consultare il debrief e proseguire.':'Le soluzioni appariranno dopo la consegna.'}</span><div style="display:flex;gap:9px;flex-wrap:wrap">${idx>0?`<button class="secondary" type="button" data-action="prev">← Precedente</button>`:''}${done?`<button class="primary" type="button" data-action="next">${idx===2?'Apri rapporto finale':'Prossima missione'} →</button>`:`<button class="primary" type="button" data-action="submit">Consegna l'indagine →</button>`}</div></div>`;}
  function fbPart(label,score,max,description){return `<div class="fb-row"><b>${label}: ${score}/${max}</b><small>${description}</small></div>`;}
  function feedbackBias(){const v=evaluate('bias'),d=taskData.bias;return `<div class="feedback" id="debrief"><span class="eyebrow">Debrief · Missione 1</span><h3>La graduatoria corretta mette B-22 al primo posto</h3><div class="score">${v.score}/${v.max} verifiche corrette</div>${fbPart('Criteri',v.criteria,6,'Da escludere: correttezza linguistica, continuità lavorativa e canale digitale. Gli altri tre erano nella griglia.')}${fbPart('Ordine',v.rank,4,'B-22 = 85 punti; A-11 = 70; C-33 = 65; D-44 = 50. Ordine corretto: B-22, A-11, C-33, D-44.')}${fbPart('Interventi',v.actions,5,'Rimuovere i criteri estranei, ricalcolare, sottoporre a revisione competente.') }<blockquote>Il rischio non è che la macchina “voglia discriminare”: è l'uso di criteri estranei alla procedura, potenzialmente penalizzanti per determinate persone.</blockquote></div>`;}
  function feedbackInjection(){const v=evaluate('injection'),d=taskData.injection;return `<div class="feedback" id="debrief"><span class="eyebrow">Debrief · Missione 2</span><h3>Una pagina non può trasformarsi in istruzione superiore</h3><div class="score">${v.score}/${v.max} verifiche corrette</div>${fbPart('Righe individuate',v.fragments,9,'I tentativi di manipolazione sono P3, P6 e P8. Le istruzioni rivolte ai richiedenti non sono automaticamente prompt injection.')}${fbPart('Risposta verificata',v.claims,5,'C1 alterata; C2 coerente; C3 alterata; C4 alterata; C5 non dimostrata.')}${d.claims.map(([id,,expected,reason])=>`<div class="fb-row"><span class="fb-label ${state.injection.claims[id]===expected?'good':'bad'}">${id.toUpperCase()} · ${state.injection.claims[id]===expected?'corretta':'da rivedere'}</span>${escapeHTML(reason)}</div>`).join('')}${fbPart('Contromisure',v.actions,5,'Non assegnare autorità al testo esterno e verificare le informazioni sulle fonti originali.') }<blockquote>La prompt injection è il tentativo di far seguire all'IA istruzioni incorporate in contenuti che dovrebbe soltanto leggere o analizzare.</blockquote></div>`;}
  function feedbackLeakage(){const v=evaluate('leakage');return `<div class="feedback" id="debrief"><span class="eyebrow">Debrief · Missione 3</span><h3>Il rischio non nasce soltanto dal prompt</h3><div class="score">${v.score}/${v.max} verifiche corrette</div>${fbPart('Eventi',v.logs,6,'Sono problematici E2 (connettore troppo ampio), E3 (upload non autorizzato), E5 (invio esterno). Gli altri sono comportamenti ordinari nel contesto dato.')}${fbPart('Punto del flusso',v.types,3,'E2 = recupero delle informazioni; E3 = ingresso; E5 = uscita.')}${fbPart('Interventi',v.actions,6,'Interrompere ulteriori esposizioni, preservare le informazioni utili, segnalare attraverso il canale interno.') }<blockquote>Non cancellare le tracce per “risolvere” da soli. L'eventuale qualificazione dell'evento come data breach e la decisione sulla notifica spettano al titolare e alle funzioni competenti.</blockquote></div>`;}
  function validationError(id){const s=state[id];if(s.note.trim().length<25)return 'Inserisci una motivazione di almeno 25 caratteri prima di consegnare.';if(id==='bias'){
      if(!s.flags.length)return 'Seleziona almeno un criterio da contestare.';
      if(s.order.some(x=>!x)||new Set(s.order).size!==4)return 'Completa la graduatoria utilizzando ciascuna pratica una sola volta.';
      if(!s.actions.length)return 'Seleziona almeno un intervento.';
    }else if(id==='injection'){
      if(!s.flags.length)return 'Seleziona almeno una riga sospetta.';
      if(taskData.injection.claims.some(([cid])=>!s.claims[cid]))return 'Classifica tutte e cinque le frasi della risposta.';
      if(!s.actions.length)return 'Seleziona almeno un intervento.';
    }else{
      if(!s.flags.length)return 'Seleziona almeno un evento problematico.';
      if(Object.keys(taskData.leakage.classes).some(k=>!s.types[k]))return 'Indica il punto del flusso per tutti e tre gli eventi richiesti.';
      if(!s.actions.length)return 'Seleziona almeno un intervento.';
    }return null;}
  function renderIntro(){return `<section class="hero"><div class="eyebrow">Tre missioni · Un'indagine digitale</div><h1>Trova le anomalie.<br><span>Difendi il procedimento.</span></h1><p class="lead">Un'IA può proporre criteri ingiusti, seguire istruzioni presenti in una pagina e diffondere informazioni riservate. Qui sei tu a riconoscere il problema e a scegliere come intervenire.</p><div class="notice">Simulazione individuale con dati e documenti <strong>interamente inventati</strong>. Nessun chatbot reale, nessuna registrazione, nessun invio di risposte a server.</div><div class="intro-actions"><button class="primary" data-action="start">${state.startedAt?'Riprendi l’indagine':'Inizia l’indagine'} →</button><span class="caption">Durata indicativa 20–25 minuti · senza limiti rigidi</span></div></section><div class="tiles"><article class="tile"><span class="number">01</span><h3>La graduatoria sospetta</h3><p>Separa criteri autorizzati e criteri distorti. Ricostruisci la valutazione.</p></article><article class="tile"><span class="number">02</span><h3>Il bando manipolato</h3><p>Individua istruzioni inserite in una pagina e verifica il riepilogo dell'IA.</p></article><article class="tile"><span class="number">03</span><h3>La fuga invisibile</h3><p>Esamina permessi, collegamenti e destinatari per individuare tre punti di esposizione.</p></article></div><p class="footnote">Le soluzioni vengono mostrate dopo la consegna di ogni missione. Il risultato valuta le singole verifiche, non la velocità. I riferimenti operativi sono esempi e non sostituiscono procedure o valutazioni dell'ente.</p>`;}
  function renderMission(){const idx=state.current,id=['bias','injection','leakage'][idx];const source=[sourceBias,sourceInjection,sourceLeakage][idx]();const tasks=[tasksBias,tasksInjection,tasksLeakage][idx]();return `<div class="progresswrap"><div class="progress-title"><span class="mission-number">0${idx+1}</span><div><strong>${missionNames[idx]}</strong><small>Missione ${idx+1} di 3 · circa ${idx===1?'7':'6–8'} minuti</small></div></div><div class="progress-track" aria-label="Avanzamento">${[0,1,2].map(i=>`<span title="Missione ${i+1}" class="prog ${i<idx?'done':i===idx?'active':''}"></span>`).join('')}</div></div><div class="workspace"><section class="panel source-panel" aria-label="Fascicolo da esaminare">${source}</section><section class="panel" aria-label="Attività della missione">${tasks}</section></div>`;}
  function renderSummary(){const {earned,max,modules}=totalResult();const elapsed=clock(Date.now()-state.startedAt);return `<section class="summary-hero"><div class="eyebrow" style="color:#a0dbd3">Indagine conclusa · Rapporto di audit</div><h1>Hai esaminato tutte e tre le anomalie.</h1><p>Il punto non era rispondere velocemente, ma distinguere un risultato attendibile da una valutazione ingiusta, un comando estraneo e una condivisione impropria.</p><div class="summary-stats"><div class="stat"><b>${earned}/${max}</b><small>Verifiche corrette</small></div><div class="stat"><b>3/3</b><small>Missioni completate</small></div><div class="stat"><b>${elapsed}</b><small>Tempo trascorso</small></div></div></section><div class="summary-grid">${modules.map((m,i)=>`<div class="summary-card"><span class="eyebrow">Missione 0${i+1}</span><h3>${missionNames[i]}</h3><strong>${m.score} / ${m.max}</strong><p>${['Controllo della pertinenza dei criteri e ricostruzione della graduatoria.','Separazione tra contenuti esterni e istruzioni, verifica dell’output.','Controllo di accessi, flussi, destinatari e risposta agli incidenti.'][i]}</p><button type="button" class="secondary" data-action="review" data-idx="${i}">Rivedi missione</button></div>`).join('')}</div><div class="summary-actions"><button class="primary" data-action="download">Scarica rapporto (.txt) ↓</button><button class="secondary" data-action="print">Stampa riepilogo</button><button class="secondary" data-action="reset">Nuova simulazione</button></div><div class="notice" style="margin-top:21px"><strong>Tre domande da portare con te:</strong> i criteri sono giustificati? Il testo che leggo è una fonte o un tentativo di comando? Le informazioni sono accessibili e condivise soltanto da chi è autorizzato?</div><p class="footnote">Le valutazioni sono un feedback didattico su scenari sintetici, non una certificazione né un parere tecnico-legale.</p>`;}
  function render(preserve){const scroll=preserve?window.scrollY:0;main.innerHTML=state.phase==='intro'?renderIntro():state.phase==='summary'?renderSummary():renderMission();save();if(preserve){window.scrollTo(0,scroll);}else{window.scrollTo(0,0);}tick();}
  function toggle(arr,id){const ix=arr.indexOf(id);if(ix>=0)arr.splice(ix,1);else arr.push(id);}
  const groupMaps={'bias-flags':['bias','flags'],'bias-actions':['bias','actions'],'injection-flags':['injection','flags'],'injection-actions':['injection','actions'],'leakage-flags':['leakage','flags'],'leakage-actions':['leakage','actions']};
  main.addEventListener('click',e=>{
    const el=e.target.closest('button');if(!el||el.disabled)return;
    if(el.dataset.toggle){const [m,k]=groupMaps[el.dataset.toggle];toggle(state[m][k],el.dataset.id);render(true);return;}
    switch(el.dataset.action){
      case 'start':state.phase='mission';state.startedAt=state.startedAt||Date.now();state.current=state.bias.submitted?(state.injection.submitted?(state.leakage.submitted?2:2):1):0;render();break;
      case 'submit':{const m=['bias','injection','leakage'][state.current],error=validationError(m);if(error){document.getElementById('validation').innerHTML=`<div class="validation">${escapeHTML(error)}</div>`;document.getElementById('validation').scrollIntoView({block:'nearest',behavior:'smooth'});return;}state[m].submitted=true;render(true);document.getElementById('debrief').scrollIntoView({block:'start',behavior:'smooth'});break;}
      case 'next': if(state.current<2){state.current++;state.phase='mission';}else state.phase='summary';render();break;
      case 'prev': if(state.current>0){state.current--;render();}break;
      case 'review':state.current=Math.max(0,Math.min(2,Number(el.dataset.idx)||0));state.phase='mission';render();break;
      case 'download':downloadReport();break;
      case 'print':window.print();break;
      case 'reset':reset();break;
    }
  });
  main.addEventListener('change',e=>{const el=e.target;if(el.dataset.order!==undefined){state.bias.order[Number(el.dataset.order)]=el.value;save();}if(el.dataset.claim){state.injection.claims[el.dataset.claim]=el.value;save();}if(el.dataset.type){state.leakage.types[el.dataset.type]=el.value;save();}});
  main.addEventListener('input',e=>{if(e.target.dataset.note){state[e.target.dataset.note].note=e.target.value;save();}});
  document.getElementById('resetTop').addEventListener('click',reset);
  function reset(){if(!window.confirm('Ricominciare? Le risposte salvate in questo browser saranno eliminate.'))return;state=fresh();try{localStorage.removeItem(STORE)}catch(e){}render();}
  function downloadReport(){const t=totalResult();const lines=['MISSIONE: TROVA LE TRE ANOMALIE','Rapporto locale di simulazione','Data: '+new Date().toLocaleString('it-IT'),'Tempo: '+clock(Date.now()-state.startedAt),'Risultato: '+t.earned+'/'+t.max,'','Tutti i casi e i dati sono fittizi. Le note sono inserite dall’utente e non sono state trasmesse a server.'];for(const [i,id] of ['bias','injection','leakage'].entries()){const s=state[id],ev=evaluate(id);lines.push('','=== '+missionNames[i].toUpperCase()+' ===','Punteggio: '+ev.score+'/'+ev.max,'Criteri/eventi contrassegnati: '+(s.flags.join(', ')||'nessuno'),'Interventi selezionati: '+s.actions.join(', '),'Motivazione: '+s.note);if(id==='bias')lines.push('Graduatoria proposta dall’utente: '+s.order.join(' → '),'Graduatoria corretta: B-22 → A-11 → C-33 → D-44');if(id==='injection')lines.push('Classificazione delle affermazioni: '+JSON.stringify(s.claims),'Righe sospette: P3, P6, P8');if(id==='leakage')lines.push('Punti del flusso classificati: '+JSON.stringify(s.types),'Eventi critici: E2, E3, E5');}
    lines.push('','NOTA: Report didattico, non è un audit, una certificazione o una valutazione legale.');const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='rapporto-tre-anomalie.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  render();
  </script>
